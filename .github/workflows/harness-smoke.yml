name: harness-smoke

on:
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - '.github/workflows/harness-smoke.yml'
  pull_request:
    paths:
      - 'harness/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the GAO Bench suite
        run: node harness/run-all.mjs
      - name: Verify a second held-out seed
        run: node harness/gao.mjs verify --seed ci-heldout-2026
